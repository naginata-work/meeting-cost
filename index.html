<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Cost Calculator / 会議コスト計算機</title>
<meta name="description" content="参加人数と時給から、今この会議にいくらかかっているかをリアルタイムで表示します。">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4214020669195548"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #14100c; --card: #211a13; --text: #f8f2e9; --sub: #b0a08c;
    --accent: #f2704a; --accent2: #6ee7b7; --border: #35291d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .home-link { font-size: 22px; text-decoration: none; line-height: 1; }
  .lang-btn { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  h1 { font-size: 21px; text-align: center; margin: 4px 0 4px; }
  .lead { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input, select { width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; background: #17120d; color: var(--text); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 12px; }
  .start-btn, .stop-btn, .copy-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .start-btn { background: var(--accent); color: #2b0f04; }
  .stop-btn { background: none; border: 1px solid var(--border); color: var(--text); }
  #displayCard { display: none; text-align: center; }
  .elapsed { font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .cost-num { font-size: 40px; font-weight: bold; color: var(--accent2); margin: 4px 0 12px; }
  .copy-btn { background: none; border: 1px solid var(--border); color: var(--text); font-weight: normal; font-size: 13.5px; margin-top: 8px; }
  .footer-links { text-align: center; font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.8; }
  .footer-links a { color: var(--accent2); text-decoration: none; }
  /* desktop-scale */
  @media (min-width: 900px) { .wrap { zoom: 1.3; } }
  @media (min-width: 1400px) { .wrap { zoom: 1.5; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row"><a href="https://naginata-work.github.io/" class="home-link" title="All tools">🧰</a><button class="lang-btn" id="langBtn">EN</button></div>
  <h1 id="title">💸 会議コスト計算機</h1>
  <p class="lead" id="lead">参加人数と時給から、今この会議にいくらかかっているかをリアルタイム表示。</p>

  <div class="card" id="formCard">
    <div class="row">
      <div class="field">
        <label id="peopleLabel">参加人数</label>
        <input type="number" id="people" value="5" min="1">
      </div>
      <div class="field">
        <label id="currencyLabel">通貨</label>
        <select id="currency">
          <option value="¥" selected>¥ (円)</option>
          <option value="$">$ (USD)</option>
          <option value="€">€ (EUR)</option>
          <option value="£">£ (GBP)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label id="wageLabel">1人あたりの時給(概算)</label>
      <input type="number" id="wage" value="3000" min="0">
    </div>
    <button class="start-btn" id="startBtn"></button>
  </div>

  <div class="card" id="displayCard">
    <div class="elapsed" id="elapsedLabel"></div>
    <div class="cost-num" id="costNum">0</div>
    <button class="stop-btn" id="stopBtn"></button>
    <button class="copy-btn" id="copyBtn"></button>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="aboutTitle" style="font-size:15px; color:var(--text); margin:0 0 8px;"></h2>
    <p id="aboutBody1" style="margin:0 0 10px;"></p>
    <p id="aboutBody2" style="margin:0;"></p>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="faqTitle" style="font-size:15px; color:var(--text); margin:0 0 10px;"></h2>
    <p id="faq1Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq1A" style="margin:0 0 12px;"></p>
    <p id="faq2Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq2A" style="margin:0;"></p>
  </div>

  <p class="footer-links" id="footerLinks"></p>
  <p style="text-align:center; font-size:11px; color:var(--sub); margin-top:4px;">
    <a href="https://naginata-work.github.io/" style="color:var(--sub);" id="allToolsLink"></a> ・
    <a href="https://naginata-work.github.io/privacy.html" style="color:var(--sub);" id="privacyLink"></a>
  </p>
</div>

<script>
  const I18N = {
    ja: {
      title: '💸 会議コスト計算機',
      lead: '参加人数と時給から、今この会議にいくらかかっているかをリアルタイム表示。',
      peopleLabel: '参加人数',
      currencyLabel: '通貨',
      wageLabel: '1人あたりの時給(概算)',
      startBtn: '会議を開始する',
      stopBtn: '終了する',
      elapsedLabel: sec => `経過時間: ${formatElapsed(sec)}`,
      copyBtn: '結果をコピー',
      copied: 'コピーしました!',
      shareText: (cur, cost, sec) => `${formatElapsed(sec)}の会議で、約${cur}${cost}かかりました💸`,
      footerLinks: '他のツールも作っています → <a href="https://naginata-work.github.io/warikan-tool/" target="_blank" rel="noopener">割り勘計算機</a> / <a href="https://naginata-work.github.io/focus-timer/" target="_blank" rel="noopener">集中タイマー</a>',
      aboutTitle: '会議のコストを可視化する理由',
      aboutBody1: '1時間の会議に5人が参加すれば、それは1人の1時間分の作業ではなく、5人分・合計5時間分の人件費が動いていることになります。しかし多くの職場では、会議の「時間」は意識されても「金額」として意識される機会はほとんどありません。',
      aboutBody2: '参加人数と1人あたりの概算時給を入力して「会議を開始する」を押すと、経過時間に応じてリアルタイムでコストが積み上がっていきます。「この会議、実はこれだけかかっている」という気づきを、会議の進行中に共有する材料としてお使いください。',
      faqTitle: 'よくある質問',
      faq1Q: '時給が分からない場合はどう入力すればいい?',
      faq1A: 'おおよその目安で構いません。月給を「20(営業日)×8(時間)」で割った概算値や、業界の平均時給を入力するだけでも、会議コストの大きさを実感するには十分です。',
      faq2Q: '交通費や会場費なども含められる?',
      faq2A: '現在のバージョンは人件費(参加人数×時給×時間)のみを計算する仕様です。追加費用がある場合は、計算結果に別途加算してご利用ください。',
    },
    en: {
      title: '💸 Meeting Cost Calculator',
      lead: 'See how much this meeting is costing, live, based on headcount and hourly rate.',
      peopleLabel: 'Number of attendees',
      currencyLabel: 'Currency',
      wageLabel: 'Hourly rate per person (approx.)',
      startBtn: 'Start meeting',
      stopBtn: 'End meeting',
      elapsedLabel: sec => `Elapsed: ${formatElapsed(sec)}`,
      copyBtn: 'Copy result',
      copied: 'Copied!',
      shareText: (cur, cost, sec) => `This ${formatElapsed(sec)} meeting cost about ${cur}${cost} 💸`,
      footerLinks: 'Also made these → <a href="https://naginata-work.github.io/warikan-tool/" target="_blank" rel="noopener">Bill Splitter</a> / <a href="https://naginata-work.github.io/focus-timer/" target="_blank" rel="noopener">Focus Timer</a>',
      aboutTitle: 'Why put a price on meetings',
      aboutBody1: "A one-hour meeting with 5 people isn't one hour of work — it's 5 people's worth of salary, running at the same time. Most workplaces track meeting length closely but almost never translate that into an actual dollar figure.",
      aboutBody2: "Enter the headcount and an approximate hourly rate per person, hit \"Start meeting,\" and watch the running cost climb in real time as the meeting goes on. It's a simple way to make the true cost of a long meeting visible while it's happening.",
      faqTitle: 'FAQ',
      faq1Q: "I don't know everyone's exact hourly rate — what should I enter?",
      faq1A: "A rough estimate is fine. Dividing an annual salary by roughly 2,000 working hours, or just using an industry-average rate, is more than enough to get a meaningful sense of scale.",
      faq2Q: 'Can this include travel costs or venue fees too?',
      faq2A: "This version only calculates labor cost (headcount × hourly rate × time). If there are other costs, add them to the result separately.",
    }
  };

  function loadLang() { try { return localStorage.getItem('meetingCostLang'); } catch (e) { return null; } }
  function saveLang(l) { try { localStorage.setItem('meetingCostLang', l); } catch (e) {} }
  let lang = loadLang() === 'en' ? 'en' : 'ja';
  function t() { return I18N[lang]; }

  function formatElapsed(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  let ratePerSecond = 0;
  let elapsedSeconds = 0;
  let timerId = null;
  let currency = '¥';

  document.getElementById('startBtn').addEventListener('click', () => {
    const people = parseFloat(document.getElementById('people').value);
    const wage = parseFloat(document.getElementById('wage').value);
    currency = document.getElementById('currency').value;
    if (!people || people <= 0 || isNaN(wage) || wage < 0) return;
    ratePerSecond = (people * wage) / 3600;
    elapsedSeconds = 0;
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('displayCard').style.display = 'block';
    updateDisplay();
    clearInterval(timerId);
    timerId = setInterval(() => {
      elapsedSeconds++;
      updateDisplay();
    }, 1000);
  });

  function updateDisplay() {
    const cost = ratePerSecond * elapsedSeconds;
    document.getElementById('elapsedLabel').textContent = t().elapsedLabel(elapsedSeconds);
    document.getElementById('costNum').textContent = currency + Math.round(cost).toLocaleString();
  }

  document.getElementById('stopBtn').addEventListener('click', () => {
    clearInterval(timerId);
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('displayCard').style.display = 'none';
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const cost = Math.round(ratePerSecond * elapsedSeconds).toLocaleString();
    const text = t().shareText(currency, cost, elapsedSeconds) + ' ' + location.href;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = t().copied;
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch {
      alert(text);
    }
  });

  function renderStaticText() {
    document.getElementById('title').textContent = t().title;
    document.getElementById('lead').textContent = t().lead;
    document.getElementById('peopleLabel').textContent = t().peopleLabel;
    document.getElementById('currencyLabel').textContent = t().currencyLabel;
    document.getElementById('wageLabel').textContent = t().wageLabel;
    document.getElementById('startBtn').textContent = t().startBtn;
    document.getElementById('stopBtn').textContent = t().stopBtn;
    document.getElementById('copyBtn').textContent = t().copyBtn;
    document.getElementById('footerLinks').innerHTML = t().footerLinks;
    document.getElementById('aboutTitle').textContent = t().aboutTitle;
    document.getElementById('aboutBody1').textContent = t().aboutBody1;
    document.getElementById('aboutBody2').textContent = t().aboutBody2;
    document.getElementById('faqTitle').textContent = t().faqTitle;
    document.getElementById('faq1Q').textContent = t().faq1Q;
    document.getElementById('faq1A').textContent = t().faq1A;
    document.getElementById('faq2Q').textContent = t().faq2Q;
    document.getElementById('faq2A').textContent = t().faq2A;
    document.getElementById('allToolsLink').textContent = lang === 'ja' ? '他のツール一覧' : 'All tools';
    document.getElementById('allToolsLink').href = 'https://naginata-work.github.io/';
    document.getElementById('privacyLink').textContent = lang === 'ja' ? 'プライバシーポリシー' : 'Privacy policy';
    document.getElementById('privacyLink').href = 'https://naginata-work.github.io/privacy.html';
    if (timerId) updateDisplay();
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    saveLang(lang);
    document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
    renderStaticText();
  });

  document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
  renderStaticText();
</script>
</body>
</html>
